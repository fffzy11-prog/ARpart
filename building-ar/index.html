<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>建筑图像 AR</title>
  <script>
    window.arDiagnostic = '正在加载 AR 组件…';
    window.showARDiagnostic = message => {
      window.arDiagnostic = message;
      const box = document.querySelector('#status');
      if (box) box.textContent = message;
    };
    window.addEventListener('error', event => {
      if (event.target.tagName === 'SCRIPT') window.showARDiagnostic('AR 脚本下载失败，请检查网络后刷新：' + event.target.src);
      else if (event.message) window.showARDiagnostic('启动错误：' + event.message);
    }, true);
    window.addEventListener('unhandledrejection', event => window.showARDiagnostic('启动失败：' + (event.reason?.message || event.reason)));
    if (navigator.mediaDevices?.getUserMedia) {
      const original = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
      navigator.mediaDevices.getUserMedia = async constraints => {
        window.showARDiagnostic('正在请求相机，请在浏览器弹窗中允许…');
        try {
          const stream = await original(constraints);
          window.showARDiagnostic('相机已允许，正在加载识别数据和初始化跟踪…');
          return stream;
        } catch (error) {
          window.cameraFailure = error.name;
          window.showARDiagnostic('相机失败：' + error.name + '。请检查网站及系统的相机权限，然后刷新。');
          throw error;
        }
      };
    }
  </script>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>body{margin:0;overflow:hidden}#status{position:fixed;top:12px;left:12px;z-index:10;background:#fffe;padding:10px;border-radius:8px;font:14px sans-serif}</style>
</head>
<body>
  <div id="status">正在启动相机，请允许相机权限…</div>
  <a-scene mindar-image="imageTargetSrc: ./assets/targets.mind;" color-space="sRGB" renderer="colorManagement: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    <a-assets><img id="building" src="./assets/building.png"></a-assets>
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <!-- PNG 所在平面与识别图平行；宽度以识别图宽度为 1。 -->
      <a-image src="#building" width="1" height="1" position="0 0 0.02" material="transparent: true; alphaTest: 0.01; side: double"></a-image>
    </a-entity>
  </a-scene>
  <script>
    const status = document.querySelector('#status');
    status.textContent = window.arDiagnostic;
    if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
      window.showARDiagnostic('当前环境不能调用相机：请在手机 Safari / Chrome 中打开 HTTPS 网站。');
    } else if (!window.AFRAME || !AFRAME.components['mindar-image']) {
      window.showARDiagnostic('AR 组件未加载成功，请检查网络是否能访问 aframe.io 和 cdn.jsdelivr.net。');
    }
    document.querySelector('a-scene').addEventListener('arReady', () => status.textContent = '请扫描 target.png 识别图');
    document.querySelector('a-scene').addEventListener('arError', () => window.showARDiagnostic('相机启动失败：' + (window.cameraFailure || '请检查 HTTPS 和相机权限')));
    document.querySelector('#target').addEventListener('targetFound', () => status.textContent = '识别成功，移动识别图试试');
    document.querySelector('#target').addEventListener('targetLost', () => status.textContent = '识别图丢失，请重新对准');
  </script>
</body>
</html>
